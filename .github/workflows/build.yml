name: Build minified assets

# Lints, tests and rebuilds the generated files (index.html, sw.js,
# script.min.js, style.min.css) so GitHub Pages (served from main/root)
# never ships stale output after editing src/ or css/.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "css/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-minified-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Commit regenerated minified assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild generated assets [skip ci]"
          file_pattern: "index.html sw.js script.min.js style.min.css"
