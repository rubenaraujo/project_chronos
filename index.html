<!DOCTYPE html>
<html>

<head>
    <link rel="shortcut icon" type="image/png" href="website-icons/logo-with-text-no-bg-24.png" />
    <title>Chronos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="256x256" href="apple-touch-icon.png">
    <!-- Warm up the connection to the CORS proxy early, since every train data
         fetch depends on it; shaves off DNS/TCP/TLS handshake latency. -->
    <link rel="preconnect" href="https://corsproxy.ruben-araujo.workers.dev">
    <link rel="dns-prefetch" href="https://corsproxy.ruben-araujo.workers.dev">
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="train.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <div class="logo-container">
        <img src="./website-icons/logo-with-text-no-bg.png" class="logo" width="270" height="95" />
    </div>
    <div id="loader" class="loader">
        <div class="train-loader">
            <div class="container">
                <div class="track"></div>
                <div class="train"></div>
            </div>
            <div id="loader-text" class="loader-text">Aguarde por favor...</div>
        </div>
    </div>
    <div id="table" class="table-responsive">
        <div class="time">
            Passa em
            <select id="where-am-i" onchange="fetchData()">
                <option value="porto_s_bento">PORTO S. BENTO</option>
                <option value="porto_campanha">PORTO CAMPANHÃ</option>
                <option value="trofa">TROFA</option>
                <option value="ermesinde">ERMESINDE</option>
                <option value="vizela">VIZELA</option>
                <option value="braga">BRAGA</option>
            </select>
            <t>a</t> 
            <input type="date" id="start-date" onchange="fetchData()"">
            <button id="fetch-button" onclick="fetchData()" aria-label="Atualizar">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <polyline points="21 3 21 9 15 9" />
                </svg>
            </button>
            <button id="toggle-past-button" onclick="toggleShowPast()" aria-label="Mostrar comboios passados">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
            </button>
        </div>
        <div id="subtitle"></div>
        <table id="data-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Origem</th>
                    <th>Destino</th>
                    <th>Observações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <br>
        <div class="footer">
            <small>
                developed by Ruben Araujo
            </small>
        </div>
    </div>
    <div id="popup" class="popup">
        <div id="popup-loader" class="loader">
            <div class="train-loader">
                <div class="container">
                    <div class="track"></div>
                    <div class="train"></div>
                </div>
                
            </div>
        </div>
        <div id="popup-content" class="popup-content"></div>
        <button class="close-button" onclick="closePopup()">×</button>
    </div>
    <script src="script.min.js"></script>
</body>
</html>
